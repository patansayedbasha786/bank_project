<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Bank of India - Admin Portal</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        * {
            font-family: 'Inter', sans-serif;
        }
        
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .card-shadow {
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transition: all 0.3s ease;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
        
        .animate-fade-in {
            animation: fadeIn 0.5s ease-in;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .loading-spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            min-width: 300px;
            padding: 16px;
            border-radius: 8px;
            color: white;
            font-weight: 500;
            animation: slideIn 0.3s ease-out;
        }
        
        .toast.success {
            background-color: #10b981;
        }
        
        .toast.error {
            background-color: #ef4444;
        }
        
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        .sidebar-item {
            transition: all 0.2s ease;
        }
        
        .sidebar-item:hover {
            background-color: #f8fafc;
            transform: translateX(4px);
        }
        
        .sidebar-item.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            transform: translateX(4px);
        }
        
        .form-input {
            transition: all 0.2s ease;
        }
        
        .form-input:focus {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.15);
        }
        
        .stats-card {
            transition: all 0.3s ease;
        }
        
        .stats-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.15);
        }
    </style>
</head>
<body class="bg-gray-50">
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect } = React;
        
        // Toast notification component
        const Toast = ({ message, type, onClose }) => {
            useEffect(() => {
                const timer = setTimeout(onClose, 4000);
                return () => clearTimeout(timer);
            }, [onClose]);
            
            return (
                <div className={`toast ${type}`}>
                    <div className="flex items-center justify-between">
                        <div className="flex items-center">
                            <i className={`fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'} mr-2`}></i>
                            <span>{message}</span>
                        </div>
                        <button onClick={onClose} className="ml-4 text-white hover:text-gray-200">
                            <i className="fas fa-times"></i>
                        </button>
                    </div>
                </div>
            );
        };
        
        // Loading component
        const Loading = () => (
            <div className="flex items-center justify-center">
                <div className="loading-spinner"></div>
                <span className="ml-2">Loading...</span>
            </div>
        );
        
        // Login component
        const Login = ({ onLogin }) => {
            const [formData, setFormData] = useState({
                username: '',
                password: '',
                table_name: 'bank_transactions'
            });
            const [loading, setLoading] = useState(false);
            const [toast, setToast] = useState(null);
            
            const handleSubmit = async (e) => {
                e.preventDefault();
                setLoading(true);
                
                try {
                    const response = await fetch('/api/login', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        credentials: 'include',
                        body: JSON.stringify(formData)
                    });
                    
                    const data = await response.json();
                    
                    if (response.ok) {
                        setToast({ message: 'Login successful! Redirecting...', type: 'success' });
                        setTimeout(() => onLogin(data.table_name), 1500);
                    } else {
                        setToast({ message: data.error || 'Login failed. Please check your credentials.', type: 'error' });
                    }
                } catch (error) {
                    setToast({ message: 'Network error. Please check your connection and try again.', type: 'error' });
                }
                
                setLoading(false);
            };
            
            return (
                <div className="min-h-screen gradient-bg flex items-center justify-center p-4">
                    {toast && (
                        <Toast 
                            message={toast.message} 
                            type={toast.type} 
                            onClose={() => setToast(null)} 
                        />
                    )}
                    
                    <div className="bg-white rounded-2xl card-shadow p-8 w-full max-w-md animate-fade-in">
                        <div className="text-center mb-8">
                            <div className="w-20 h-20 bg-gradient-to-r from-blue-500 to-purple-600 rounded-full flex items-center justify-center mx-auto mb-4">
                                <i className="fas fa-university text-white text-3xl"></i>
                            </div>
                            <h1 className="text-3xl font-bold text-gray-800 mb-2">Royal Bank of India</h1>
                            <p className="text-gray-600">Admin Portal Access</p>
                        </div>
                        
                        <form onSubmit={handleSubmit} className="space-y-6">
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">
                                    <i className="fas fa-user mr-2"></i>Username
                                </label>
                                <input
                                    type="text"
                                    value={formData.username}
                                    onChange={(e) => setFormData({...formData, username: e.target.value})}
                                    className="form-input w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                    placeholder="Enter your username"
                                    required
                                />
                            </div>
                            
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">
                                    <i className="fas fa-lock mr-2"></i>Password
                                </label>
                                <input
                                    type="password"
                                    value={formData.password}
                                    onChange={(e) => setFormData({...formData, password: e.target.value})}
                                    className="form-input w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                    placeholder="Enter your password"
                                    required
                                />
                            </div>
                            
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">
                                    <i className="fas fa-database mr-2"></i>Database Table
                                </label>
                                <input
                                    type="text"
                                    value={formData.table_name}
                                    onChange={(e) => setFormData({...formData, table_name: e.target.value})}
                                    className="form-input w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                    placeholder="Enter table name"
                                    required
                                />
                            </div>
                            
                            <button
                                type="submit"
                                disabled={loading}
                                className="w-full btn-primary text-white py-3 px-4 rounded-lg font-medium disabled:opacity-50 disabled:cursor-not-allowed"
                            >
                                {loading ? <Loading /> : (
                                    <>
                                        <i className="fas fa-sign-in-alt mr-2"></i>
                                        Login to Dashboard
                                    </>
                                )}
                            </button>
                        </form>
                        
                        <div className="mt-6 text-center">
                            <p className="text-xs text-gray-500">
                                Secure banking portal • Protected by encryption
                            </p>
                        </div>
                    </div>
                </div>
            );
        };
        
        // Dashboard component
        const Dashboard = ({ tableName, onLogout }) => {
            const [currentView, setCurrentView] = useState('dashboard');
            const [toast, setToast] = useState(null);
            
            const menuItems = [
                { id: 'dashboard', icon: 'fas fa-tachometer-alt', label: 'Dashboard', color: 'text-blue-600' },
                { id: 'check-user', icon: 'fas fa-user-search', label: 'Check User', color: 'text-green-600' },
                { id: 'create-user', icon: 'fas fa-user-plus', label: 'Create User', color: 'text-purple-600' },
                { id: 'deposit', icon: 'fas fa-plus-circle', label: 'Deposit', color: 'text-emerald-600' },
                { id: 'withdraw', icon: 'fas fa-minus-circle', label: 'Withdraw', color: 'text-red-600' },
                { id: 'mini-statement', icon: 'fas fa-file-alt', label: 'Mini Statement', color: 'text-orange-600' },
                { id: 'balance-enquiry', icon: 'fas fa-balance-scale', label: 'Balance Enquiry', color: 'text-indigo-600' }
            ];
            
            const handleLogout = async () => {
                try {
                    await fetch('/api/logout', {
                        method: 'POST',
                        credentials: 'include'
                    });
                    setToast({ message: 'Logged out successfully', type: 'success' });
                    setTimeout(() => onLogout(), 1000);
                } catch (error) {
                    console.error('Logout error:', error);
                    onLogout();
                }
            };
            
            const renderContent = () => {
                switch (currentView) {
                    case 'dashboard':
                        return <DashboardHome tableName={tableName} setToast={setToast} />;
                    case 'check-user':
                        return <CheckUser setToast={setToast} />;
                    case 'create-user':
                        return <CreateUser setToast={setToast} />;
                    case 'deposit':
                        return <Deposit setToast={setToast} />;
                    case 'withdraw':
                        return <Withdraw setToast={setToast} />;
                    case 'mini-statement':
                        return <MiniStatement setToast={setToast} />;
                    case 'balance-enquiry':
                        return <BalanceEnquiry setToast={setToast} />;
                    default:
                        return <DashboardHome tableName={tableName} setToast={setToast} />;
                }
            };
            
            return (
                <div className="min-h-screen bg-gray-50">
                    {toast && (
                        <Toast 
                            message={toast.message} 
                            type={toast.type} 
                            onClose={() => setToast(null)} 
                        />
                    )}
                    
                    {/* Header */}
                    <header className="bg-white shadow-sm border-b sticky top-0 z-40">
                        <div className="flex items-center justify-between px-6 py-4">
                            <div className="flex items-center">
                                <div className="w-12 h-12 bg-gradient-to-r from-blue-500 to-purple-600 rounded-lg flex items-center justify-center mr-4">
                                    <i className="fas fa-university text-white text-xl"></i>
                                </div>
                                <div>
                                    <h1 className="text-xl font-bold text-gray-800">Royal Bank of India</h1>
                                    <p className="text-sm text-gray-600">Database: {tableName}</p>
                                </div>
                            </div>
                            
                            <div className="flex items-center space-x-4">
                                <div className="text-right">
                                    <p className="text-sm font-medium text-gray-800">Admin Portal</p>
                                    <p className="text-xs text-gray-500">Logged in as Administrator</p>
                                </div>
                                <button
                                    onClick={handleLogout}
                                    className="flex items-center px-4 py-2 text-gray-600 hover:text-gray-800 hover:bg-gray-100 rounded-lg transition-colors"
                                >
                                    <i className="fas fa-sign-out-alt mr-2"></i>
                                    Logout
                                </button>
                            </div>
                        </div>
                    </header>
                    
                    <div className="flex">
                        {/* Sidebar */}
                        <aside className="w-64 bg-white shadow-sm min-h-screen">
                            <nav className="p-4">
                                <ul className="space-y-2">
                                    {menuItems.map((item) => (
                                        <li key={item.id}>
                                            <button
                                                onClick={() => setCurrentView(item.id)}
                                                className={`sidebar-item w-full flex items-center px-4 py-3 rounded-lg font-medium ${
                                                    currentView === item.id
                                                        ? 'active text-white'
                                                        : 'text-gray-600 hover:text-gray-800'
                                                }`}
                                            >
                                                <i className={`${item.icon} mr-3 ${currentView === item.id ? 'text-white' : item.color}`}></i>
                                                {item.label}
                                            </button>
                                        </li>
                                    ))}
                                </ul>
                            </nav>
                        </aside>
                        
                        {/* Main Content */}
                        <main className="flex-1 p-6">
                            {renderContent()}
                        </main>
                    </div>
                </div>
            );
        };
        
        // Dashboard Home component
        const DashboardHome = ({ tableName, setToast }) => {
            const [stats, setStats] = useState({
                totalUsers: 0,
                totalDeposits: 0,
                totalWithdrawals: 0,
                totalBalance: 0
            });
            const [loading, setLoading] = useState(true);
            
            useEffect(() => {
                fetchDashboardStats();
            }, []);
            
            const fetchDashboardStats = async () => {
                try {
                    const response = await fetch('/api/dashboard-stats', {
                        credentials: 'include'
                    });
                    
                    if (response.ok) {
                        const data = await response.json();
                        setStats(data);
                    }
                } catch (error) {
                    console.error('Failed to fetch dashboard stats:', error);
                } finally {
                    setLoading(false);
                }
            };
            
            const quickActions = [
                {
                    id: 'check-user',
                    title: 'Check User',
                    description: 'Search and view user information',
                    icon: 'fas fa-user-search',
                    color: 'text-blue-600',
                    bgColor: 'bg-blue-50',
                    borderColor: 'border-blue-200'
                },
                {
                    id: 'create-user',
                    title: 'Create User',
                    description: 'Add new customer account',
                    icon: 'fas fa-user-plus',
                    color: 'text-green-600',
                    bgColor: 'bg-green-50',
                    borderColor: 'border-green-200'
                },
                {
                    id: 'deposit',
                    title: 'Process Deposit',
                    description: 'Add money to customer account',
                    icon: 'fas fa-plus-circle',
                    color: 'text-emerald-600',
                    bgColor: 'bg-emerald-50',
                    borderColor: 'border-emerald-200'
                },
                {
                    id: 'withdraw',
                    title: 'Process Withdrawal',
                    description: 'Withdraw money from account',
                    icon: 'fas fa-minus-circle',
                    color: 'text-red-600',
                    bgColor: 'bg-red-50',
                    borderColor: 'border-red-200'
                },
                {
                    id: 'mini-statement',
                    title: 'Mini Statement',
                    description: 'Generate transaction history',
                    icon: 'fas fa-file-alt',
                    color: 'text-orange-600',
                    bgColor: 'bg-orange-50',
                    borderColor: 'border-orange-200'
                },
                {
                    id: 'balance-enquiry',
                    title: 'Balance Enquiry',
                    description: 'Check account balance',
                    icon: 'fas fa-balance-scale',
                    color: 'text-purple-600',
                    bgColor: 'bg-purple-50',
                    borderColor: 'border-purple-200'
                }
            ];
            
            return (
                <div className="animate-fade-in">
                    <div className="mb-8">
                        <h2 className="text-3xl font-bold text-gray-800 mb-2">Dashboard</h2>
                        <p className="text-gray-600">Welcome to Royal Bank of India Admin Portal</p>
                    </div>
                    
                    {/* Stats Cards */}
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                        <div className="stats-card bg-white rounded-xl p-6 card-shadow">
                            <div className="flex items-center">
                                <div className="w-12 h-12 bg-blue-100 rounded-lg flex items-center justify-center">
                                    <i className="fas fa-database text-blue-600 text-xl"></i>
                                </div>
                                <div className="ml-4">
                                    <p className="text-sm text-gray-600">Active Database</p>
                                    <p className="text-xl font-bold text-gray-800">{tableName}</p>
                                </div>
                            </div>
                        </div>
                        
                        <div className="stats-card bg-white rounded-xl p-6 card-shadow">
                            <div className="flex items-center">
                                <div className="w-12 h-12 bg-green-100 rounded-lg flex items-center justify-center">
                                    <i className="fas fa-users text-green-600 text-xl"></i>
                                </div>
                                <div className="ml-4">
                                    <p className="text-sm text-gray-600">Total Users</p>
                                    <p className="text-xl font-bold text-gray-800">{loading ? '...' : stats.totalUsers}</p>
                                </div>
                            </div>
                        </div>
                        
                        <div className="stats-card bg-white rounded-xl p-6 card-shadow">
                            <div className="flex items-center">
                                <div className="w-12 h-12 bg-emerald-100 rounded-lg flex items-center justify-center">
                                    <i className="fas fa-arrow-up text-emerald-600 text-xl"></i>
                                </div>
                                <div className="ml-4">
                                    <p className="text-sm text-gray-600">Total Deposits</p>
                                    <p className="text-xl font-bold text-gray-800">₹{loading ? '...' : stats.totalDeposits.toLocaleString()}</p>
                                </div>
                            </div>
                        </div>
                        
                        <div className="stats-card bg-white rounded-xl p-6 card-shadow">
                            <div className="flex items-center">
                                <div className="w-12 h-12 bg-red-100 rounded-lg flex items-center justify-center">
                                    <i className="fas fa-arrow-down text-red-600 text-xl"></i>
                                </div>
                                <div className="ml-4">
                                    <p className="text-sm text-gray-600">Total Withdrawals</p>
                                    <p className="text-xl font-bold text-gray-800">₹{loading ? '...' : stats.totalWithdrawals.toLocaleString()}</p>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    {/* Quick Actions */}
                    <div className="bg-white rounded-xl p-6 card-shadow">
                        <h3 className="text-xl font-semibold text-gray-800 mb-6">Quick Actions</h3>
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                            {quickActions.map((action) => (
                                <div
                                    key={action.id}
                                    className={`p-4 border-2 ${action.borderColor} ${action.bgColor} rounded-lg hover:shadow-md transition-all cursor-pointer group`}
                                    onClick={() => window.dispatchEvent(new CustomEvent('navigate', { detail: action.id }))}
                                >
                                    <div className="flex items-start">
                                        <i className={`${action.icon} ${action.color} text-2xl mb-3 group-hover:scale-110 transition-transform`}></i>
                                        <div className="ml-4">
                                            <h4 className="font-semibold text-gray-800 mb-1">{action.title}</h4>
                                            <p className="text-sm text-gray-600">{action.description}</p>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };
        
        // Check User component
        const CheckUser = ({ setToast }) => {
            const [aadharNo, setAadharNo] = useState('');
            const [userInfo, setUserInfo] = useState(null);
            const [loading, setLoading] = useState(false);
            
            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!aadharNo || aadharNo.length !== 12) {
                    setToast({ message: 'Please enter a valid 12-digit Aadhar number', type: 'error' });
                    return;
                }
                
                setLoading(true);
                try {
                    const response = await fetch('/api/check-user', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        credentials: 'include',
                        body: JSON.stringify({ aadhar_no: aadharNo })
                    });
                    
                    const data = await response.json();
                    
                    if (response.ok) {
                        if (data.exists) {
                            setUserInfo(data.user_info);
                            setToast({ message: 'User found successfully!', type: 'success' });
                        } else {
                            setUserInfo(null);
                            setToast({ message: 'User not found in the database', type: 'error' });
                        }
                    } else {
                        setToast({ message: data.error || 'Failed to check user', type: 'error' });
                    }
                } catch (error) {
                    setToast({ message: 'Network error. Please try again.', type: 'error' });
                }
                setLoading(false);
            };
            
            return (
                <div className="animate-fade-in">
                    <div className="mb-8">
                        <h2 className="text-3xl font-bold text-gray-800 mb-2">Check User</h2>
                        <p className="text-gray-600">Search for existing customer information</p>
                    </div>
                    
                    <div className="bg-white rounded-xl p-6 card-shadow mb-6">
                        <form onSubmit={handleSubmit} className="space-y-6">
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">
                                    <i className="fas fa-id-card mr-2"></i>Aadhar Number
                                </label>
                                <input
                                    type="text"
                                    value={aadharNo}
                                    onChange={(e) => setAadharNo(e.target.value.replace(/\D/g, '').slice(0, 12))}
                                    className="form-input w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                    placeholder="Enter 12-digit Aadhar number"
                                    maxLength="12"
                                    required
                                />
                                <p className="text-xs text-gray-500 mt-1">Enter the customer's 12-digit Aadhar number</p>
                            </div>
                            
                            <button
                                type="submit"
                                disabled={loading}
                                className="btn-primary text-white py-3 px-6 rounded-lg font-medium disabled:opacity-50"
                            >
                                {loading ? <Loading /> : (
                                    <>
                                        <i className="fas fa-search mr-2"></i>
                                        Search User
                                    </>
                                )}
                            </button>
                        </form>
                    </div>
                    
                    {userInfo && (
                        <div className="bg-white rounded-xl p-6 card-shadow">
                            <div className="flex items-center mb-6">
                                <div className="w-16 h-16 bg-gradient-to-r from-green-400 to-blue-500 rounded-full flex items-center justify-center">
                                    <i className="fas fa-user text-white text-2xl"></i>
                                </div>
                                <div className="ml-4">
                                    <h3 className="text-xl font-semibold text-gray-800">User Information</h3>
                                    <p className="text-gray-600">Customer details and account information</p>
                                </div>
                            </div>
                            
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div className="space-y-4">
                                    <div>
                                        <p className="text-sm font-medium text-gray-600">Full Name</p>
                                        <p className="text-lg font-semibold text-gray-800">{userInfo.name_of_user}</p>
                                    </div>
                                    <div>
                                        <p className="text-sm font-medium text-gray-600">Aadhar Number</p>
                                        <p className="text-lg font-semibold text-gray-800">{userInfo.aadhar_no}</p>
                                    </div>
                                    <div>
                                        <p className="text-sm font-medium text-gray-600">Phone Number</p>
                                        <p className="text-lg font-semibold text-gray-800">{userInfo.phone_no}</p>
                                    </div>
                                </div>
                                
                                <div className="space-y-4">
                                    <div>

                                                <th className="text-right py-3 px-4 font-semibold text-gray-700 border">Withdrawal</th>
                                                <th className="text-right py-3 px-4 font-semibold text-gray-700 border">Deposit</th>
                                                <th className="text-right py-3 px-4 font-semibold text-gray-700 border">Balance</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {statement.transactions.map((transaction, index) => (
                                                <tr key={index} className={index % 2 === 0 ? 'bg-white' : 'bg-gray-50'}>
                                                    <td className="py-3 px-4 text-gray-800 border">{transaction.date}</td>
                                                    <td className="py-3 px-4 text-right border">
                                                        {transaction.withdrawal > 0 ? (
                                                            <span className="text-red-600 font-medium">₹{transaction.withdrawal.toLocaleString()}</span>
                                                        ) : (
                                                            <span className="text-gray-400">-</span>
                                                        )}
                                                    </td>
                                                    <td className="py-3 px-4 text-right border">
                                                        {transaction.deposit > 0 ? (
                                                            <span className="text-green-600 font-medium">₹{transaction.deposit.toLocaleString()}</span>
                                                        ) : (
                                                            <span className="text-gray-400">-</span>
                                                        )}
                                                    </td>
                                                    <td className="py-3 px-4 text-right font-semibold text-gray-800 border">₹{transaction.balance.toLocaleString()}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                            
                            <div className="flex justify-end space-x-4 mt-8 pt-6 border-t">
                                <button
                                    onClick={printStatement}
                                    className="flex items-center px-6 py-3 bg-gray-600 text-white rounded-lg hover:bg-gray-700 transition-colors"
                                >
                                    <i className="fas fa-print mr-2"></i>
                                    Print Statement
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };
        
        // Balance Enquiry component
        const BalanceEnquiry = ({ setToast }) => {
            const [aadharNo, setAadharNo] = useState('');
            const [loading, setLoading] = useState(false);
            const [balance, setBalance] = useState(null);
            
            const handleSubmit = async (e) => {
                e.preventDefault();
                
                if (aadharNo.length !== 12) {
                    setToast({ message: 'Please enter a valid 12-digit Aadhar number', type: 'error' });
                    return;
                }
                
                setLoading(true);
                
                try {
                    const response = await fetch('/api/balance-enquiry', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        credentials: 'include',
                        body: JSON.stringify({ aadhar_no: aadharNo })
                    });
                    
                    const data = await response.json();
                    
                    if (response.ok) {
                        setBalance(data);
                        setToast({ message: 'Balance retrieved successfully!', type: 'success' });
                    } else {
                        setToast({ message: data.error || 'Failed to get balance', type: 'error' });
                    }
                } catch (error) {
                    setToast({ message: 'Network error. Please try again.', type: 'error' });
                }
                setLoading(false);
            };
            
            return (
                <div className="animate-fade-in">
                    <div className="mb-8">
                        <h2 className="text-3xl font-bold text-gray-800 mb-2">Balance Enquiry</h2>
                        <p className="text-gray-600">Check customer account balance</p>
                    </div>
                    
                    <div className="bg-white rounded-xl p-6 card-shadow mb-6">
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">
                                    <i className="fas fa-id-card mr-2"></i>Customer Aadhar Number *
                                </label>
                                <input
                                    type="text"
                                    value={aadharNo}
                                    onChange={(e) => setAadharNo(e.target.value.replace(/\D/g, '').slice(0, 12))}
                                    className="form-input w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                    placeholder="Enter customer's Aadhar number"
                                    maxLength="12"
                                    required
                                />
                            </div>
                            
                            <button
                                type="submit"
                                disabled={loading}
                                className="btn-primary text-white py-3 px-6 rounded-lg font-medium disabled:opacity-50"
                            >
                                {loading ? <Loading /> : (
                                    <>
                                        <i className="fas fa-balance-scale mr-2"></i>
                                        Check Balance
                                    </>
                                )}
                            </button>
                        </form>
                    </div>
                    
                    {balance && (
                        <div className="bg-white rounded-xl p-8 card-shadow">
                            <div className="text-center">
                                <div className="w-20 h-20 bg-gradient-to-r from-green-400 to-blue-500 rounded-full flex items-center justify-center mx-auto mb-6">
                                    <i className="fas fa-balance-scale text-white text-3xl"></i>
                                </div>
                                <h3 className="text-2xl font-bold text-gray-800 mb-2">Account Balance</h3>
                                <p className="text-gray-600 mb-6">As of {balance.current_time}</p>
                                
                                <div className="bg-gradient-to-r from-green-50 to-blue-50 rounded-xl p-8 mb-6">
                                    <p className="text-sm font-medium text-gray-600 mb-2">Account Holder</p>
                                    <p className="text-xl font-semibold text-gray-800 mb-4">{balance.name}</p>
                                    
                                    <p className="text-sm font-medium text-gray-600 mb-2">Current Balance</p>
                                    <p className="text-4xl font-bold text-green-600 mb-4">₹{balance.balance.toLocaleString()}</p>
                                    
                                    <p className="text-xs text-gray-500">Aadhar: {balance.aadhar_no}</p>
                                </div>
                                
                                <div className="text-center">
                                    <p className="text-xs text-gray-500">
                                        This balance is updated in real-time and reflects all recent transactions
                                    </p>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };
        
        // Main App component
        const App = () => {
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [tableName, setTableName] = useState('');
            const [loading, setLoading] = useState(true);
            
            useEffect(() => {
                // Check session status on app load
                fetch('/api/session-status', {
                    credentials: 'include'
                })
                .then(response => response.json())
                .then(data => {
                    if (data.authenticated) {
                        setIsAuthenticated(true);
                        setTableName(data.table_name);
                    }
                })
                .catch(error => {
                    console.error('Session check error:', error);
                })
                .finally(() => {
                    setLoading(false);
                });
            }, []);
            
            const handleLogin = (table) => {
                setIsAuthenticated(true);
                setTableName(table);
            };
            
            const handleLogout = () => {
                setIsAuthenticated(false);
                setTableName('');
            };
            
            if (loading) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-gray-50">
                        <div className="text-center">
                            <div className="w-16 h-16 bg-gradient-to-r from-blue-500 to-purple-600 rounded-full flex items-center justify-center mx-auto mb-4">
                                <i className="fas fa-university text-white text-2xl"></i>
                            </div>
                            <Loading />
                            <p className="mt-4 text-gray-600">Loading Royal Bank Portal...</p>
                        </div>
                    </div>
                );
            }
            
            return (
                <div>
                    {isAuthenticated ? (
                        <Dashboard tableName={tableName} onLogout={handleLogout} />
                    ) : (
                        <Login onLogin={handleLogin} />
                    )}
                </div>
            );
        };
        
        // Render the app
        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
