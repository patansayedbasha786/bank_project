services:
  - type: web
    name: royal-bank-app
    env: python
    buildCommand: cd server && pip install -r requirements.txt
    startCommand: cd server && gunicorn -w 4 -b 0.0.0.0:$PORT src.main:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DB_NAME
        value: royal_bank_of_india
      - key: DB_USER
        value: postgres
      - key: DB_HOST
        value: localhost
      - key: DB_PORT
        value: 5432
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
    # For production, you'll need to add your PostgreSQL database URL:
    # - key: DB_PASSWORD
    #   value: your-database-password
    # - key: DB_HOST
    #   value: your-database-host

